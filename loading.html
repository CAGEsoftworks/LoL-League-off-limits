<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DECONTAMINATION IN PROGRESS</title>
  <link rel="icon" type="image/png" sizes="16x16" href="images/icon16.png">
  <style>
    body {
      background-color: #050505;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .card {
      background-color: #0d0d0d;
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
      max-width: 500px;
      width: 100%;
      border: 2px solid #00ff88;
      text-align: center;
    }
    h2 {
      color: #00ff88;
      font-size: 20px;
      letter-spacing: 2px;
      margin-top: 0;
      text-transform: uppercase;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #1a1a1a;
      border-top: 5px solid #00ff88;
      border-radius: 50%;
      margin: 25px auto;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status-text {
      color: #dddddd;
      font-size: 14px;
      line-height: 1.5;
      min-height: 48px;
      transition: opacity 0.3s ease-in-out;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>PURGING TOXICITY</h2>
    <div class="spinner"></div>
    <p class="status-text" id="statusMessage">Initializing memory wipe...</p>
  </div>

  <script src="loading.js"></script>

</body>
</html>
