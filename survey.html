<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Alert - Intervention Protocol</title>
</head>
<body style="font-family: Consolas, 'Courier New', monospace; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;">

  <div style="background-color: #161b22; border: 2px solid #f85149; border-radius: 8px; padding: 28px; max-width: 560px; width: 100%; box-shadow: 0 0 25px rgba(248, 81, 73, 0.25);">
    
    <!-- Critical Threat Banner -->
    <div style="background-color: rgba(248, 81, 73, 0.15); border: 1px solid #f85149; border-radius: 6px; padding: 14px; margin-bottom: 24px;">
      <span id="counterText" style="font-weight: bold; color: #f85149; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; display: block;">Temptation Counter: 0</span>
      <p id="counterJoke" style="margin-top: 8px; color: #ff7b72; font-size: 0.9rem; line-height: 1.4; margin-bottom: 0;"></p>
    </div>

    <!-- Alert Header -->
    <div style="border-bottom: 1px solid #30363d; padding-bottom: 12px; margin-bottom: 20px;">
      <h1 style="font-size: 1.25rem; font-weight: bold; color: #f85149; margin: 0 0 6px 0; text-transform: uppercase; letter-spacing: 0.5px;">[!] Critical Threat Detected</h1>
      <p style="color: #8b949e; font-size: 0.85rem; margin: 0;">Unsanctioned download attempt intercepted. State your reason:</p>
    </div>

    <!-- Options Container -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;">
      <label class="option-row" style="background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: #c9d1d9;">
        <input type="radio" name="reason" value="1" style="accent-color: #f85149; transform: scale(1.1);"> I lack self-control and need a reality check.
      </label>
      <label class="option-row" style="background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: #c9d1d9;">
        <input type="radio" name="reason" value="2" style="accent-color: #f85149; transform: scale(1.1);"> I thought I could handle just one game.
      </label>
      <label class="option-row" style="background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: #c9d1d9;">
        <input type="radio" name="reason" value="3" style="accent-color: #f85149; transform: scale(1.1);"> My friends pressured me to join.
      </label>
      <label class="option-row" style="background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: #c9d1d9;">
        <input type="radio" name="reason" value="4" style="accent-color: #f85149; transform: scale(1.1);"> I am actively choosing to waste my time.
      </label>
      <label class="option-row" style="background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: #c9d1d9;">
        <input type="radio" name="reason" value="5" style="accent-color: #f85149; transform: scale(1.1);"> I am letting impulse ruin my productivity.
      </label>
    </div>

    <!-- Security Override Button -->
    <button id="nextBtn" disabled style="width: 100%; background-color: #21262d; color: #484f58; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-weight: bold; font-size: 0.95rem; font-family: Consolas, 'Courier New', monospace; cursor: not-allowed; text-transform: uppercase;">Acknowledge & Proceed</button>

  </div>

  <script src="survey.js"></script>
</body>
</html>
